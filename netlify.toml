[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The Next.js runtime plugin handles App Router routing, Server Actions,
# the proxy (middleware) layer and image optimisation on Netlify.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------
# Security headers.
#
# This application holds client financial records. It should never be
# embeddable in another site, never be sniffed for content type, and never
# leak the URLs of internal pages through referrers.
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Internal tool: keep it out of search engines entirely.
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------
# Scheduled fund-data refresh — Phase 3.
#
# Netlify scheduled functions have a short execution limit, so the job
# processes funds in small batches across invocations rather than trying
# to refresh every fund in one call. Configured here when built.
# ---------------------------------------------------------------------
